<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JARVIS Local AI</title>
  <style>
    body {
      background: #0f172a;
      color: #38bdf8;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .arc-reactor {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid #38bdf8;
      box-shadow: 0 0 25px #38bdf8, inset 0 0 15px #38bdf8;
      animation: pulse 2s infinite;
      cursor: pointer;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 35px #38bdf8, inset 0 0 25px #38bdf8; }
    }
    #status {
      font-size: 1.2rem;
      margin-top: 25px;
      color: #94a3b8;
      text-align: center;
      max-width: 80%;
      min-height: 50px;
      line-height: 1.5;
    }
    .input-container {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      width: 80%;
      max-width: 500px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      box-shadow: 0 0 10px #38bdf8;
    }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0284c7;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="arc-reactor" onclick="iniciarReconocimiento()" title="Haz clic para hablar"></div>
  <h2 id="status">Pregúntame lo que quieras o pide revisar tu correo...</h2>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Escribe aquí tu consulta..." onkeypress="detectarEnter(event)">
    <button onclick="enviarTexto()">Enviar</button>
  </div>

  <script>
    const status = document.getElementById('status');
    const userInput = document.getElementById('userInput');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-CL';
      
      recognition.onresult = (event) => {
        const texto = event.results[0][0].transcript;
        userInput.value = texto;
        procesarComando(texto);
      };

      recognition.onerror = () => {
        status.textContent = "Error al escuchar. Prueba escribiendo abajo.";
      };
    }

    function iniciarReconocimiento() {
      if (recognition) {
        try {
          recognition.start();
          status.textContent = "Escuchando...";
        } catch(e) {
          status.textContent = "Ya estoy escuchando...";
        }
      } else {
        status.textContent = "Navegador no compatible con micrófono. Usa la casilla de texto.";
      }
    }

    function detectarEnter(event) {
      if (event.key === 'Enter') {
        enviarTexto();
      }
    }

    function enviarTexto() {
      const texto = userInput.value.trim();
      if (texto !== "") {
        procesarComando(texto);
        userInput.value = "";
      }
    }

    function procesarComando(comando) {
      status.textContent = "Pensando respuesta...";
      
      fetch('http://localhost:5000/procesar', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ comando: comando })
      })
      .then(response => response.json())
      .then(data => {
        status.textContent = data.respuesta;
        hablar(data.respuesta);
      })
      .catch(error => {
        console.error("Error:", error);
        const errResp = "Error al conectar con el servidor backend.";
        status.textContent = errResp;
        hablar(errResp);
      });
    }

    function hablar(mensaje) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(mensaje);
      utterance.lang = 'es-CL';
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
